# ---------- Serveur ----------
server.port=8080

# ---------- Base de donnees H2 (fichier local, aucune installation requise) ----------
spring.datasource.url=jdbc:h2:file:./data/mehdiluxury;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console de la base : http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ---------- Upload d'images ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload-dir=./uploads

# ---------- Securite / Admin ----------
# Compte cree automatiquement au premier demarrage
app.admin.username=admin
app.admin.password=MehdiLuxury2026
# Cle de signature des tokens : CHANGEZ-LA en production
app.auth.secret=mehdi-luxury-cars-secret-key-2026-change-me
app.auth.token-validity-hours=12

# ---------- CORS (frontend Vite) ----------
app.cors.origins=http://localhost:*,http://127.0.0.1:*
